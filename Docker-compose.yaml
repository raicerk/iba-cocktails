version: '3.8'

services:
  scraper:
    build:
      context: scraping-iba
      dockerfile: Dockerfile
    container_name: cocktail_scraper
    volumes:
      - ./scraping-iba:/app

  api:
    depends_on:
      scraper:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cocktail_rag_service
    ports:
      - "8000:8000"
    volumes:
      - ./scraping-iba:/app/data
      # Monta la caché de HuggingFace en el host para no re-descargar modelos al reiniciar
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
    ports:
      - "3000:3000"
    environment:
      # Usar el nombre del servicio de la API de backend (ej: cocktail-rag-api) 
      # en lugar de localhost si se comunican por la red interna de Docker.
      # O localhost si es que el navegador hace el llamado desde tu PC
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1/cocktails
    depends_on:
      - api # o como se llame tu servicio api

volumes:
  hf_cache:
